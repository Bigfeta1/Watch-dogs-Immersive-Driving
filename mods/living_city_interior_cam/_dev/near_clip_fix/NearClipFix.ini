; NearClipFix: camera near clip plane in metres (game default 0.25). Allowed 0.01 .. 0.25.
; 0.05 tested 2026-10-20: removes the car roof cut, no distant flicker. Live: saved changes apply within 0.5 s.
[NearClip]
Near=0.13

; Rider view lift (bike first person only): raises the camera as you look up so it leaves the cap.
; Recognised by the rider camera's FOV (MarkerFov must match vectorFov in living_city_interior_cam's cameracontext.lib).
; Lift is 0 below Start, grows to Shift metres at Full (degrees up). Live: saved changes apply within 0.5 s.
[RiderLift]
MarkerFov=75.5
Start=10
Full=40
Shift=0
; Rider body hide: from HideAbove degrees up (rider view only) the near plane becomes HideNear metres,
; so the rider's own head/body are not drawn. Shift=0 above turns the lift off.
HideAbove=13.5
HideNear=1.0

; Rider tuck (bike first person only): moves the camera Forward metres along the direction of travel and
; Down metres, growing from StartSpeed to FullSpeed (m/s). Slowing down keeps it; only after Hold seconds
; standing still it eases back over Return seconds. Live: saved changes apply within 0.5 s.
[RiderTuck]
Forward=0.15
Down=0.03
StartSpeed=0.5
FullSpeed=4
Hold=1
Return=0.6
; 1 = write bin/NearClipFix_debug.csv (one row per rider camera update)
Debug=0
; 1 = hide the rider (near = [RiderLift] HideNear) while fully tucked, incl. the hold after stopping
HideWhenTucked=0
; near plane while hidden-tucked: cuts the rider's head/shoulders, keep it short enough that the bike stays (1 m cut the bike)
TuckHideNear=0.35
; near plane while tucked (blends with the tuck from [NearClip] Near; game default 0.25).
; Set equal to [NearClip] Near = off (user 2026-10-21: no visible benefit).
Near=0.13
